<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mockup - Registro</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #e9ecef;
            margin: 0;
            font-family: sans-serif;
        }

        .mobile-frame {
            width: 360px;
            height: 640px;
            background-color: #fff;
            border-radius: 24px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.15);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 10px solid #212529;
        }

        .header {
            background-color: #2e7d32;
            color: white;
            padding: 30px 20px 15px;
            text-align: center;
        }

        .header h2 {
            margin: 0;
            font-size: 24px;
        }

        .content {
            padding: 20px 30px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
            overflow-y: auto;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .input-group label {
            font-size: 14px;
            font-weight: 600;
            color: #495057;
        }

        .input-group input,
        .input-group select {
            padding: 12px;
            font-size: 16px;
            border: 2px solid #ced4da;
            border-radius: 8px;
            outline: none;
        }

        .btn-primary {
            background-color: #2e7d32;
            color: white;
            border: none;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            margin-top: 10px;
        }

        .android-nav {
            background-color: #f8f9fa;
            height: 48px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid #e9ecef;
        }

        .nav-icon {
            background-color: #adb5bd;
        }

        .nav-back {
            width: 0;
            height: 0;
            border-top: 8px solid transparent;
            border-bottom: 8px solid transparent;
            border-right: 14px solid #adb5bd;
        }

        .nav-home {
            width: 16px;
            height: 16px;
            border-radius: 50%;
        }

        .nav-recent {
            width: 16px;
            height: 16px;
            border-radius: 2px;
        }
    </style>
</head>

<body>
    <div class="mobile-frame">
        <div class="header">
            <h2>Crear Cuenta</h2>
        </div>
        <div class="content">
            <div class="input-group">
                <label>Número de Cédula</label>
                <input type="number" placeholder="Ej: 1094000000">
            </div>
            <div class="input-group">
                <label>Número de Celular</label>
                <input type="number" placeholder="Ej: 3110000000">
            </div>
            <div class="input-group">
                <label>Vereda / Ubicación</label>
                <select>
                    <option>Seleccione su vereda...</option>
                    <option>Vereda El Caimo</option>
                    <option>Vereda Pantanillo</option>
                </select>
            </div>
            <div class="input-group">
                <label>Crear PIN (4 números)</label>
                <input type="password" placeholder="••••" maxlength="4"
                    style="text-align: center; letter-spacing: 5px; font-size: 24px;">
            </div>
            <button class="btn-primary">Registrarme</button>
        </div>
        <div class="android-nav">
            <div class="nav-back"></div>
            <div class="nav-icon nav-home"></div>
            <div class="nav-icon nav-recent"></div>
        </div>
    </div>
</body>

</html>
