<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mockup - Ofertas de Trabajo</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #e9ecef;
            margin: 0;
            font-family: sans-serif;
        }

        .mobile-frame {
            width: 360px;
            height: 640px;
            background-color: #f4f6f8;
            border-radius: 24px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.15);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 10px solid #212529;
        }

        .header {
            background-color: #2e7d32;
            color: white;
            padding: 25px 20px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h2 {
            margin: 0;
            font-size: 20px;
        }

        .location-badge {
            background: rgba(255, 255, 255, 0.2);
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 12px;
        }

        .content {
            padding: 15px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
            overflow-y: auto;
        }

        /* Tarjetas de ofertas */
        .card {
            background-color: white;
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
            border: 1px solid #e9ecef;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .finca-name {
            font-weight: bold;
            font-size: 18px;
            color: #212529;
            margin: 0;
        }

        .urgency {
            background-color: #ffebee;
            color: #c62828;
            font-size: 11px;
            padding: 3px 8px;
            border-radius: 10px;
            font-weight: bold;
        }

        .job-detail {
            font-size: 15px;
            color: #495057;
            margin: 5px 0;
        }

        .job-detail strong {
            color: #d84315;
        }

        .card-footer {
            margin-top: 15px;
            display: flex;
            gap: 10px;
        }

        .btn-postular {
            background-color: #2e7d32;
            color: white;
            border: none;
            padding: 12px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            flex-grow: 1;
        }

        .btn-llamar {
            background-color: transparent;
            border: 2px solid #2e7d32;
            color: #2e7d32;
            padding: 10px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 45px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
        }

        .android-nav {
            background-color: #f8f9fa;
            height: 48px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid #e9ecef;
        }

        .nav-icon {
            background-color: #adb5bd;
        }

        .nav-back {
            width: 0;
            height: 0;
            border-top: 8px solid transparent;
            border-bottom: 8px solid transparent;
            border-right: 14px solid #adb5bd;
            cursor: pointer;
        }

        .nav-home {
            width: 16px;
            height: 16px;
            border-radius: 50%;
        }

        .nav-recent {
            width: 16px;
            height: 16px;
            border-radius: 2px;
        }
    </style>
</head>

<body>
    <div class="mobile-frame">
        <div class="header">
            <h2>Trabajos Hoy</h2>
            <div class="location-badge">📍 Vereda El Caimo</div>
        </div>
        <div class="content">

            <!-- Oferta 1 -->
            <div class="card">
                <div class="card-header">
                    <p class="finca-name">Finca La Esperanza</p>
                    <span class="urgency">Faltan 3 cupos</span>
                </div>
                <p class="job-detail">Labor: <strong>Recolección de Café</strong></p>
                <p class="job-detail">Pago: A destajo</p>
                <div class="card-footer">
                    <button class="btn-postular">¡Voy para allá!</button>
                    <button class="btn-llamar">📞</button>
                </div>
            </div>

            <!-- Oferta 2 -->
            <div class="card">
                <div class="card-header">
                    <p class="finca-name">Finca El Paraíso</p>
                    <span class="urgency" style="background-color: #e8f5e9; color: #2e7d32;">Falta 1 cupo</span>
                </div>
                <p class="job-detail">Labor: <strong>Guadaña</strong></p>
                <p class="job-detail">Pago: $50.000 / día</p>
                <div class="card-footer">
                    <button class="btn-postular">¡Voy para allá!</button>
                    <button class="btn-llamar">📞</button>
                </div>
            </div>

        </div>
        <div class="android-nav">
            <a href="index.html">
                <div class="nav-back"></div>
            </a>
            <div class="nav-icon nav-home"></div>
            <div class="nav-icon nav-recent"></div>
        </div>
    </div>
</body>

</html>
