<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mockup - Chat Interno</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #e9ecef;
            margin: 0;
            font-family: sans-serif;
        }

        .mobile-frame {
            width: 360px;
            height: 640px;
            background-color: #f4f6f8;
            border-radius: 24px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.15);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 10px solid #212529;
        }

        .header {
            background-color: #00695c;
            color: white;
            padding: 20px 15px 15px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .avatar {
            width: 45px;
            height: 45px;
            background-color: #fff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #00695c;
            font-weight: bold;
            font-size: 18px;
        }

        .name h3 {
            margin: 0;
            font-size: 18px;
        }

        .status-badge {
            background-color: #4caf50;
            color: white;
            font-size: 10px;
            padding: 3px 8px;
            border-radius: 10px;
            font-weight: bold;
            display: inline-block;
            margin-top: 3px;
        }

        .chat-area {
            padding: 15px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
            overflow-y: auto;
            background-color: #e0f2f1;
        }

        .message {
            max-width: 75%;
            padding: 12px 15px;
            border-radius: 15px;
            font-size: 15px;
            line-height: 1.4;
            position: relative;
        }

        .msg-received {
            background-color: white;
            color: #212529;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
        }

        .msg-sent {
            background-color: #00695c;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
        }

        .time {
            font-size: 10px;
            opacity: 0.7;
            display: block;
            text-align: right;
            margin-top: 5px;
        }

        .input-area {
            background-color: white;
            padding: 10px 15px;
            display: flex;
            gap: 10px;
            align-items: center;
            border-top: 1px solid #dee2e6;
        }

        .input-area input {
            flex-grow: 1;
            padding: 12px;
            border: 1px solid #ced4da;
            border-radius: 20px;
            outline: none;
            font-size: 15px;
        }

        .btn-send {
            background-color: #00695c;
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .android-nav {
            background-color: #f8f9fa;
            height: 48px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid #e9ecef;
        }

        .nav-icon {
            background-color: #adb5bd;
        }

        .nav-back {
            width: 0;
            height: 0;
            border-top: 8px solid transparent;
            border-bottom: 8px solid transparent;
            border-right: 14px solid #adb5bd;
            cursor: pointer;
        }

        .nav-home {
            width: 16px;
            height: 16px;
            border-radius: 50%;
        }

        .nav-recent {
            width: 16px;
            height: 16px;
            border-radius: 2px;
        }
    </style>
</head>

<body>
    <div class="mobile-frame">
        <div class="header">
            <div class="avatar">CR</div>
            <div class="name">
                <h3>Carlos Restrepo</h3>
                <span class="status-badge">Jornalero Activo (App)</span>
            </div>
        </div>

        <div class="chat-area">
            <div class="message msg-received">
                Patrón, ¿a qué horas empezamos la recolección mañana?
                <span class="time">06:15 PM</span>
            </div>
            <div class="message msg-sent">
                Carlos, a las 6:00 AM en el lote de abajo.
                <span class="time">06:20 PM</span>
            </div>
        </div>

        <div class="input-area">
            <input type="text" placeholder="Escribe un mensaje interno...">
            <button class="btn-send">➤</button>
        </div>

        <div class="android-nav">
            <a href="index.html">
                <div class="nav-back"></div>
            </a>
            <div class="nav-icon nav-home"></div>
            <div class="nav-icon nav-recent"></div>
        </div>
    </div>
</body>

</html>
