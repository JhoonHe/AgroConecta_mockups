<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mockup - Contacto Externo</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #e9ecef;
            margin: 0;
            font-family: sans-serif;
        }

        .mobile-frame {
            width: 360px;
            height: 640px;
            background-color: #f8f9fa;
            border-radius: 24px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.15);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 10px solid #212529;
        }

        .header {
            background-color: #2e7d32;
            color: white;
            padding: 25px 20px 15px;
            text-align: center;
        }

        /* Gris azulado para perfiles pasivos */
        .header h2 {
            margin: 0;
            font-size: 20px;
        }

        .content {
            padding: 25px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 25px;
        }

        .profile-card {
            background-color: white;
            width: 100%;
            border-radius: 15px;
            padding: 25px;
            box-sizing: border-box;
            text-align: center;
            border: 1px solid #dee2e6;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }

        .avatar-large {
            width: 80px;
            height: 80px;
            background-color: #eceff1;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            margin: 0 auto 15px;
            color: #455a64;
        }

        .profile-card h3 {
            margin: 0 0 5px;
            font-size: 22px;
            color: #212529;
        }

        .profile-card p {
            margin: 0;
            color: #6c757d;
            font-size: 16px;
        }

        .warning-banner {
            background-color: #fff3cd;
            color: #856404;
            padding: 15px;
            border-radius: 10px;
            font-size: 13px;
            text-align: center;
            border: 1px solid #ffeeba;
        }

        .action-buttons {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn-call {
            background-color: #4caf50;
            color: white;
            border: none;
            padding: 18px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 4px 6px rgba(76, 175, 80, 0.3);
        }

        .btn-sms {
            background-color: #1976d2;
            color: white;
            border: none;
            padding: 18px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 4px 6px rgba(25, 118, 210, 0.3);
        }

        .android-nav {
            background-color: #f8f9fa;
            height: 48px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid #e9ecef;
        }

        .nav-icon {
            background-color: #adb5bd;
        }

        .nav-back {
            width: 0;
            height: 0;
            border-top: 8px solid transparent;
            border-bottom: 8px solid transparent;
            border-right: 14px solid #adb5bd;
            cursor: pointer;
        }

        .nav-home {
            width: 16px;
            height: 16px;
            border-radius: 50%;
        }

        .nav-recent {
            width: 16px;
            height: 16px;
            border-radius: 2px;
        }
    </style>
</head>

<body>
    <div class="mobile-frame">
        <div class="header">
            <h2>Contactar Trabajador</h2>
        </div>

        <div class="content">
            <div class="profile-card">
                <div class="avatar-large">👨‍🌾</div>
                <h3>Juan Pérez</h3>
                <p>Machetero / Guadañador</p>
                <p style="margin-top: 5px; font-weight: bold; color: #212529;">Cel: 311 000 0000</p>
            </div>

            <div class="warning-banner">
                <b>Nota:</b> Juan es un Jornalero Pasivo y no usa la aplicación. El contacto se realizará a través de la
                red celular tradicional.
            </div>

            <div class="action-buttons">
                <button class="btn-call">📞 Llamada Normal</button>
                <button class="btn-sms">✉️ Enviar SMS</button>
            </div>
        </div>

        <div class="android-nav">
            <a href="index.html">
                <div class="nav-back"></div>
            </a>
            <div class="nav-icon nav-home"></div>
            <div class="nav-icon nav-recent"></div>
        </div>
    </div>
</body>

</html>
