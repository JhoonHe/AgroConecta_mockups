<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mockup - Directorio de Trabajadores</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #e9ecef;
            margin: 0;
            font-family: sans-serif;
        }

        .mobile-frame {
            width: 360px;
            height: 640px;
            background-color: #f4f6f8;
            border-radius: 24px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.15);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 10px solid #212529;
        }

        .header {
            background-color: #2e7d32;
            color: white;
            padding: 25px 20px 15px;
            text-align: center;
        }

        /* Azul oscuro para el directorio */
        .header h2 {
            margin: 0;
            font-size: 22px;
        }

        /* Barra de búsqueda rural (texto grande) */
        .search-bar {
            background-color: white;
            padding: 15px;
            border-bottom: 1px solid #dee2e6;
        }

        .search-bar input {
            width: 90%;
            padding: 12px;
            font-size: 16px;
            border: 2px solid #ced4da;
            border-radius: 8px;
            outline: none;
        }

        .content {
            padding: 15px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
        }

        /* Tarjeta de Trabajador */
        .worker-card {
            background-color: white;
            border-radius: 12px;
            padding: 15px;
            border: 1px solid #e9ecef;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .worker-info h3 {
            margin: 0 0 5px 0;
            font-size: 18px;
            color: #212529;
        }

        .worker-info p {
            margin: 2px 0;
            font-size: 14px;
            color: #495057;
        }

        .badge-pasivo {
            background-color: #eceff1;
            color: #546e7a;
            font-size: 11px;
            padding: 3px 6px;
            border-radius: 6px;
            font-weight: bold;
            margin-top: 5px;
            display: inline-block;
        }

        .badge-activo {
            background-color: #e8f5e9;
            color: #2e7d32;
            font-size: 11px;
            padding: 3px 6px;
            border-radius: 6px;
            font-weight: bold;
            margin-top: 5px;
            display: inline-block;
        }

        .actions {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .btn-icon {
            background-color: #f8f9fa;
            border: 1px solid #ced4da;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .btn-call {
            background-color: #e8f5e9;
            color: #2e7d32;
            border-color: #2e7d32;
        }

        .android-nav {
            background-color: #f8f9fa;
            height: 48px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid #e9ecef;
        }

        .nav-icon {
            background-color: #adb5bd;
        }

        .nav-back {
            width: 0;
            height: 0;
            border-top: 8px solid transparent;
            border-bottom: 8px solid transparent;
            border-right: 14px solid #adb5bd;
            cursor: pointer;
        }

        .nav-home {
            width: 16px;
            height: 16px;
            border-radius: 50%;
        }

        .nav-recent {
            width: 16px;
            height: 16px;
            border-radius: 2px;
        }
    </style>
</head>

<body>
    <div class="mobile-frame">
        <div class="header">
            <h2>Directorio Personal</h2>
        </div>

        <div class="search-bar">
            <input type="text" placeholder="🔍 Filtrar por Vereda o Labor...">
        </div>

        <div class="content">

            <div class="worker-card">
                <div class="worker-info">
                    <h3>Juan Pérez</h3>
                    <p>Machetero / Guadañador</p>
                    <p>📍 Vereda El Caimo</p>
                    <span class="badge-pasivo">Jornalero Pasivo (Sin App)</span>
                </div>
                <div class="actions">
                    <button class="btn-icon btn-call">📞</button>
                    <button class="btn-icon">✉️</button>
                </div>
            </div>

            <div class="worker-card">
                <div class="worker-info">
                    <h3>Carlos Restrepo</h3>
                    <p>Recolector de Café</p>
                    <p>📍 Vereda Pantanillo</p>
                    <span class="badge-activo">Jornalero Activo (En App)</span>
                </div>
                <div class="actions">
                    <button class="btn-icon">💬</button>
                </div>
            </div>

        </div>
        <div class="android-nav">
            <a href="index.html">
                <div class="nav-back"></div>
            </a>
            <div class="nav-icon nav-home"></div>
            <div class="nav-icon nav-recent"></div>
        </div>
    </div>
</body>

</html>
