<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mockup - Directorio de Fincas</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #e9ecef;
            margin: 0;
            font-family: sans-serif;
        }

        .mobile-frame {
            width: 360px;
            height: 640px;
            background-color: #f4f6f8;
            border-radius: 24px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.15);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 10px solid #212529;
        }

        .header {
            background-color: #2e7d32;
            color: white;
            padding: 25px 20px 15px;
            text-align: center;
        }

        .header h2 {
            margin: 0;
            font-size: 22px;
        }

        .search-bar {
            background-color: white;
            padding: 15px;
            border-bottom: 1px solid #dee2e6;
            display: flex;
            gap: 10px;
        }

        .search-bar select {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border: 2px solid #ced4da;
            border-radius: 8px;
            outline: none;
            background-color: white;
        }

        .content {
            padding: 15px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
            overflow-y: auto;
        }

        .finca-card {
            background-color: white;
            border-radius: 12px;
            padding: 15px;
            border: 1px solid #e9ecef;
            text-align: center;
        }

        .finca-icon {
            font-size: 40px;
            margin-bottom: 10px;
        }

        .finca-name {
            font-size: 20px;
            font-weight: bold;
            color: #212529;
            margin: 0;
        }

        .finca-owner {
            font-size: 15px;
            color: #495057;
            margin: 5px 0;
        }

        .finca-location {
            font-size: 14px;
            color: #d84315;
            font-weight: bold;
        }

        .btn-view {
            background-color: #f8f9fa;
            border: 2px solid #2e7d32;
            color: #2e7d32;
            padding: 10px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
        }

        .android-nav {
            background-color: #f8f9fa;
            height: 48px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid #e9ecef;
        }

        .nav-icon {
            background-color: #adb5bd;
        }

        .nav-back {
            width: 0;
            height: 0;
            border-top: 8px solid transparent;
            border-bottom: 8px solid transparent;
            border-right: 14px solid #adb5bd;
            cursor: pointer;
        }

        .nav-home {
            width: 16px;
            height: 16px;
            border-radius: 50%;
        }

        .nav-recent {
            width: 16px;
            height: 16px;
            border-radius: 2px;
        }
    </style>
</head>

<body>
    <div class="mobile-frame">
        <div class="header">
            <h2>Fincas Cercanas</h2>
        </div>

        <div class="search-bar">
            <select>
                <option>📍 Todas las veredas</option>
                <option>Vereda El Caimo</option>
                <option>Vereda Pantanillo</option>
            </select>
        </div>

        <div class="content">

            <div class="finca-card">
                <div class="finca-icon">🏡</div>
                <p class="finca-name">Finca La Esperanza</p>
                <p class="finca-owner">Propietario: Don Manuel Arias</p>
                <p class="finca-location">📍 Vereda El Caimo (A 2 km)</p>
                <button class="btn-view">Ver Perfil de la Finca</button>
            </div>

            <div class="finca-card">
                <div class="finca-icon">🧑‍🌾</div>
                <p class="finca-name">Finca El Paraíso</p>
                <p class="finca-owner">Propietario: Doña Carmen</p>
                <p class="finca-location">📍 Vereda Pantanillo (A 5 km)</p>
                <button class="btn-view">Ver Perfil de la Finca</button>
            </div>

        </div>
        <div class="android-nav">
            <a href="index.html">
                <div class="nav-back"></div>
            </a>
            <div class="nav-icon nav-home"></div>
            <div class="nav-icon nav-recent"></div>
        </div>
    </div>
</body>

</html>
