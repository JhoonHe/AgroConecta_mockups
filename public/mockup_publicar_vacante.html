<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mockup - Publicar Vacante</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #e9ecef;
            margin: 0;
            font-family: sans-serif;
        }

        .mobile-frame {
            width: 360px;
            height: 640px;
            background-color: #fff;
            border-radius: 24px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.15);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 10px solid #212529;
        }

        .header {
            background-color: #2e7d32;
            color: white;
            padding: 30px 20px 15px;
            text-align: center;
        }

        /* Color naranja para la acción de ofertar */
        .header h2 {
            margin: 0;
            font-size: 22px;
        }

        .content {
            padding: 25px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
            overflow-y: auto;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .input-group label {
            font-size: 15px;
            font-weight: 600;
            color: #495057;
        }

        .input-group select,
        .input-group input {
            padding: 15px;
            font-size: 18px;
            border: 2px solid #ced4da;
            border-radius: 10px;
            outline: none;
            background-color: #f8f9fa;
        }

        .cantidad-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 2px solid #ced4da;
            border-radius: 10px;
            overflow: hidden;
        }

        .btn-qty {
            background-color: #e9ecef;
            border: none;
            width: 60px;
            height: 50px;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            color: #495057;
        }

        .cantidad-container input {
            width: 100%;
            border: none;
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            background: transparent;
            padding: 0;
            border-radius: 0;
        }

        .btn-primary {
            background-color: #2e7d32;
            color: white;
            border: none;
            padding: 18px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            margin-top: 10px;
        }

        .android-nav {
            background-color: #f8f9fa;
            height: 48px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid #e9ecef;
        }

        .nav-icon {
            background-color: #adb5bd;
        }

        .nav-back {
            width: 0;
            height: 0;
            border-top: 8px solid transparent;
            border-bottom: 8px solid transparent;
            border-right: 14px solid #adb5bd;
            cursor: pointer;
        }

        .nav-home {
            width: 16px;
            height: 16px;
            border-radius: 50%;
        }

        .nav-recent {
            width: 16px;
            height: 16px;
            border-radius: 2px;
        }
    </style>
</head>

<body>
    <div class="mobile-frame">
        <div class="header">
            <h2>Pedir Trabajadores</h2>
        </div>
        <div class="content">
            <div class="input-group">
                <label>¿Qué labor necesita hoy?</label>
                <select>
                    <option>Recolección de Café</option>
                    <option>Guadaña / Desyerba</option>
                    <option>Fumigación</option>
                    <option>Carga / Oficios Varios</option>
                </select>
            </div>

            <div class="input-group">
                <label>¿Cuántas personas necesita?</label>
                <div class="cantidad-container">
                    <button class="btn-qty">-</button>
                    <input type="number" value="5" readonly>
                    <button class="btn-qty">+</button>
                </div>
            </div>

            <div class="input-group">
                <label>Pago ofrecido (Opcional)</label>
                <input type="text" placeholder="Ej: A destajo ($800/kilo)">
            </div>

            <button class="btn-primary">Publicar Oferta Ahora</button>
        </div>
        <div class="android-nav">
            <a href="index.html">
                <div class="nav-back"></div>
            </a>
            <div class="nav-icon nav-home"></div>
            <div class="nav-icon nav-recent"></div>
        </div>
    </div>
</body>

</html>
